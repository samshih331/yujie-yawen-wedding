<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Wedding Issue</title>
  <meta name="description" content="婚禮邀請 · 桌次查詢">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 現場查詢模式（?seat）才出現的頂列 -->
  <div class="seat-bar">
    <span class="seat-bar-title"><span data-cfg="groom"></span> &amp; <span data-cfg="bride"></span></span>
    <a class="seat-bar-link" id="full-link">看完整邀請 →</a>
  </div>

  <header class="masthead">
    <div class="wrap mast-row">
      <span>The Wedding Issue</span>
      <span data-cfg="dateText"></span>
    </div>
  </header>

  <main>
    <!-- 封面 -->
    <section class="hero">
      <div class="wrap hero-grid">
        <figure class="hero-photo">
          <img src="../assets/photo.jpg" alt="婚紗照" width="1400" height="2100">
        </figure>
        <div class="hero-text">
          <p class="kicker">Issue No. 1011 — <em>a love story</em></p>
          <h1 class="names">
            <span data-cfg="groom"></span>
            <i>&amp;</i>
            <span data-cfg="bride"></span>
          </h1>
          <p class="tagline">We're getting married.</p>
          <p class="lede">誠摯邀請您，一同見證我們的幸福時刻。</p>
        </div>
      </div>
    </section>

    <!-- 01 日期 -->
    <section class="chapter" id="date">
      <div class="wrap">
        <header class="ch-head">
          <span class="ch-no">01</span>
          <h2><em>The Date</em><small>日期</small></h2>
        </header>
        <p class="big-count" id="big-count"></p>
        <p class="clock" id="clock"></p>
        <dl class="spec">
          <div><dt>日期</dt><dd><span data-cfg="dateText"></span>　<span data-cfg="dowText"></span></dd></div>
          <div><dt>時間</dt><dd id="times"></dd></div>
          <div><dt>地點</dt><dd><span data-cfg="venue"></span>　<span data-cfg="hall"></span></dd></div>
        </dl>
      </div>
    </section>

    <!-- 跨頁照片 -->
    <figure class="spread">
      <img src="../assets/photo-detail.jpg" alt="婚紗照" width="1400" height="1050" loading="lazy">
      <figcaption class="wrap"><em>Together, in the forest.</em></figcaption>
    </figure>

    <!-- 02 地點 -->
    <section class="chapter" id="place">
      <div class="wrap">
        <header class="ch-head">
          <span class="ch-no">02</span>
          <h2><em>The Place</em><small>地點</small></h2>
        </header>
        <p class="venue-name" data-cfg="venue"></p>
        <dl class="spec" id="place-spec">
          <div><dt>地址</dt><dd><a id="addr-link" target="_blank" rel="noopener"><span data-cfg="address"></span> <span data-cfg="hall"></span></a></dd></div>
          <div id="tel-row"><dt>電話</dt><dd><a id="tel-link" data-cfg="phone"></a></dd></div>
        </dl>
        <button class="map-thumb" id="map-open" type="button" aria-label="放大交通資訊圖">
          <img src="../assets/map.jpg" alt="交通資訊圖" loading="lazy" onerror="this.closest('.map-thumb').remove()">
          <span>點圖放大</span>
        </button>
        <a class="text-link" id="map-link" target="_blank" rel="noopener">在 Google 地圖開啟 →</a>
      </div>
    </section>

    <!-- 03 查詢桌次 -->
    <section class="chapter seat" id="seat">
      <div class="wrap">
        <header class="ch-head">
          <span class="ch-no">03</span>
          <h2><em>Find Your Seat</em><small>查詢桌次</small></h2>
        </header>
        <p class="seat-desc">輸入您的姓名（可輸入部分），即可找到婚禮當天的桌次。<br>「共 N 位」代表您與家人同桌。</p>
        <form class="seat-form" id="seat-form" autocomplete="off">
          <input id="seat-q" type="search" placeholder="請輸入姓名" aria-label="姓名">
          <button type="submit">查詢</button>
        </form>
        <p class="seat-meta" id="seat-meta" aria-live="polite"></p>
        <ol class="seat-list" id="seat-list"></ol>
      </div>
    </section>
  </main>

  <footer class="colophon">
    <div class="wrap">
      <p class="thanks"><em>Thank you.</em></p>
      <p><span data-cfg="groom"></span> &amp; <span data-cfg="bride"></span> · <span data-cfg="dateText"></span> · <span data-cfg="venue"></span></p>
    </div>
  </footer>

  <dialog class="lightbox" id="map-dialog">
    <form method="dialog"><button class="lb-close" aria-label="關閉">✕</button></form>
    <img src="../assets/map.jpg" alt="交通資訊圖">
  </dialog>

  <script src="../config.js"></script>
  <script src="../seating.js"></script>
  <script src="../common.js"></script>
  <script src="main.js"></script>
</body>
</html>
