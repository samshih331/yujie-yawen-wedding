<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>我們要結婚了</title>
  <meta name="description" content="婚禮邀請 · 桌次查詢">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 圖示：腳印、愛心（自製 SVG，各裝置外觀一致） -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="paw" viewBox="0 0 40 40">
      <ellipse cx="20" cy="27" rx="9" ry="7.5"/>
      <ellipse cx="9" cy="16" rx="3.6" ry="4.6" transform="rotate(-18 9 16)"/>
      <ellipse cx="16" cy="10" rx="3.6" ry="4.8" transform="rotate(-6 16 10)"/>
      <ellipse cx="24" cy="10" rx="3.6" ry="4.8" transform="rotate(6 24 10)"/>
      <ellipse cx="31" cy="16" rx="3.6" ry="4.6" transform="rotate(18 31 16)"/>
    </symbol>
    <symbol id="heart" viewBox="0 0 32 30">
      <path d="M16 28S2 19.5 2 10.2C2 5.6 5.6 2 10 2c2.6 0 4.8 1.3 6 3.3C17.2 3.3 19.4 2 22 2c4.4 0 8 3.6 8 8.2C30 19.5 16 28 16 28z"/>
    </symbol>
  </svg>

  <!-- 現場查詢模式（?seat）才出現的頂列 -->
  <div class="seat-bar">
    <span><span data-cfg="groom"></span> <svg class="ic-heart"><use href="#heart"/></svg> <span data-cfg="bride"></span> 的婚禮</span>
    <a id="full-link">看完整邀請 →</a>
  </div>

  <main class="trail">
    <!-- 封面 -->
    <section class="stop hero">
      <div class="hearts" aria-hidden="true">
        <svg><use href="#heart"/></svg><svg><use href="#heart"/></svg><svg><use href="#heart"/></svg><svg><use href="#heart"/></svg><svg><use href="#heart"/></svg>
      </div>
      <p class="hand hello">我們要結婚了！</p>
      <figure class="polaroid">
        <span class="tape" aria-hidden="true"></span>
        <img src="../assets/photo.jpg" alt="婚紗照" width="1400" height="2100">
        <figcaption class="hand">在森林裡，說好了一輩子</figcaption>
      </figure>
      <h1 class="couple hand">
        <span data-cfg="groom"></span>
        <svg class="ic-heart"><use href="#heart"/></svg>
        <span data-cfg="bride"></span>
      </h1>
      <p class="invite">一路走來，我們把彼此放進生命裡，<br>也決定把未來交給對方。<br>想邀請最重要的你，一起來見證。</p>
    </section>

    <!-- 日子 -->
    <section class="stop" id="date">
      <svg class="node"><use href="#paw"/></svg>
      <h2 class="hand">那一天</h2>
      <div class="date-row">
        <div class="cal" id="cal" aria-label="月曆">
          <p class="cal-title hand" id="cal-title"></p>
          <div class="cal-grid" id="cal-grid"></div>
        </div>
        <div class="stamp" id="stamp"></div>
      </div>
      <p class="when"><b data-cfg="dateText"></b>　<span data-cfg="dowText"></span></p>
      <ul class="plan" id="plan"></ul>
    </section>

    <!-- 地點：路徑旁的註記，不做卡片 -->
    <section class="stop" id="place">
      <svg class="node"><use href="#paw"/></svg>
      <h2 class="hand">怎麼去</h2>
      <p class="venue hand" data-cfg="venue"></p>
      <p class="addr"><a id="addr-link" target="_blank" rel="noopener"><span data-cfg="address"></span> <span data-cfg="hall"></span></a></p>
      <p class="tel" id="tel-row">電話　<a id="tel-link" data-cfg="phone"></a></p>
      <dl class="notes" id="notes"></dl>
      <button class="map-thumb" id="map-open" type="button" aria-label="放大交通資訊圖">
        <img src="../assets/map.jpg" alt="交通資訊圖" loading="lazy" onerror="this.closest('.map-thumb').remove()">
        <span class="hint">點我放大</span>
      </button>
      <a class="pill" id="map-link" target="_blank" rel="noopener">打開 Google 地圖</a>
    </section>

    <!-- 查詢座位 -->
    <section class="stop seat" id="seat">
      <svg class="node"><use href="#paw"/></svg>
      <h2 class="hand">找找你的座位</h2>
      <p class="seat-desc">輸入你的名字（打一部分也可以），<br>就能知道婚禮當天坐在第幾桌。</p>
      <form class="seat-form" id="seat-form" autocomplete="off">
        <input id="seat-q" type="search" placeholder="例如：王小明" aria-label="姓名">
        <button type="submit">查詢</button>
      </form>
      <p class="seat-meta" id="seat-meta" aria-live="polite"></p>
      <div class="card" id="card" hidden>
        <p class="card-title">婚宴報到卡</p>
        <ul class="seat-list" id="seat-list"></ul>
      </div>
    </section>

    <footer class="stop end">
      <svg class="node"><use href="#paw"/></svg>
      <p class="hand">謝謝你來 <svg class="ic-heart"><use href="#heart"/></svg></p>
      <p class="sign"><span data-cfg="groom"></span> &amp; <span data-cfg="bride"></span> 敬邀</p>
    </footer>
  </main>

  <dialog class="lightbox" id="map-dialog">
    <form method="dialog"><button class="lb-close" aria-label="關閉">✕</button></form>
    <img src="../assets/map.jpg" alt="交通資訊圖">
  </dialog>

  <script src="../config.js"></script>
  <script src="../seating.js"></script>
  <script src="../common.js"></script>
  <script src="main.js"></script>
</body>
</html>
