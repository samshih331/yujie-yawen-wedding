<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>風格挑選</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Serif TC', serif; background: #ecebe8; color: #2b2622; padding: 36px 0 48px; }
    header { text-align: center; padding: 0 16px; }
    h1 { font-size: 1.5rem; font-weight: 500; letter-spacing: .3em; padding-left: .3em; }
    header p { margin-top: .8rem; font-size: .85rem; letter-spacing: .1em; line-height: 1.9; color: #6a625a; }
    .row {
      display: flex;
      gap: 28px;
      margin-top: 32px;
      padding: 8px 16px 16px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      justify-content: safe center;
    }
    figure { flex: none; scroll-snap-align: center; text-align: center; }
    .phone {
      width: 375px;
      max-width: calc(100vw - 48px);
      height: 740px;
      max-height: 75vh;
      border: 10px solid #1d1d1f;
      border-radius: 36px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 20px 40px rgba(0,0,0,.18);
    }
    iframe { width: 100%; height: 100%; border: 0; display: block; }
    figcaption { margin-top: 18px; }
    figcaption b { display: block; font-size: 1.1rem; font-weight: 500; letter-spacing: .2em; }
    figcaption span { display: block; margin-top: .4rem; font-size: .8rem; color: #6a625a; letter-spacing: .08em; }
    figcaption a { display: inline-block; margin-top: .8rem; font-size: .78rem; color: #2b2622; letter-spacing: .15em; }
    .sw { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin: 0 2px; vertical-align: -1px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.1); }
  </style>
</head>
<body>
  <header>
    <h1>風格挑選</h1>
    <p>三種配色，內容與功能完全相同。<br>每個預覽都可以捲動，點「開啟完整頁面」可在新分頁看。</p>
  </header>

  <div class="row">
    <figure>
      <div class="phone"><iframe src="./?theme=forest" title="森林綠" loading="lazy"></iframe></div>
      <figcaption>
        <b>A ・ 森林綠</b>
        <span><i class="sw" style="background:#7d8f78"></i><i class="sw" style="background:#5f725b"></i><i class="sw" style="background:#f1f3ee"></i>　呼應婚紗照的森林</span>
        <a href="./?theme=forest" target="_blank" rel="noopener">開啟完整頁面 ↗</a>
      </figcaption>
    </figure>
    <figure>
      <div class="phone"><iframe src="./?theme=latte" title="奶茶暖棕" loading="lazy"></iframe></div>
      <figcaption>
        <b>B ・ 奶茶暖棕</b>
        <span><i class="sw" style="background:#b58a67"></i><i class="sw" style="background:#8a6448"></i><i class="sw" style="background:#f4ede3"></i>　溫暖經典，同靚點交通卡色調</span>
        <a href="./?theme=latte" target="_blank" rel="noopener">開啟完整頁面 ↗</a>
      </figcaption>
    </figure>
    <figure>
      <div class="phone"><iframe src="./?theme=night" title="墨綠金" loading="lazy"></iframe></div>
      <figcaption>
        <b>C ・ 墨綠金</b>
        <span><i class="sw" style="background:#243129"></i><i class="sw" style="background:#c9a96e"></i><i class="sw" style="background:#1b2420"></i>　深色晚宴感，香檳金點綴</span>
        <a href="./?theme=night" target="_blank" rel="noopener">開啟完整頁面 ↗</a>
      </figcaption>
    </figure>
  </div>
</body>
</html>
